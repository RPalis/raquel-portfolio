<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Case Study — Raquel Palis</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet" />

  <style>
    /* --- RESET & BASE --- */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #0A0A0A;
      --text: #FFFFFF;
      --muted: rgba(255,255,255,0.45);
      --divider: rgba(255,255,255,0.12);
      --hover-row: rgba(255,255,255,0.03);
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-weight: 400;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; text-decoration: none; }

    /* --- NAV --- */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 28px 48px;
    }

    nav::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to bottom, rgba(10,10,10,0.92) 0%, transparent 100%);
      pointer-events: none;
      z-index: -1;
    }

    .nav-logo {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .nav-back {
      font-size: 13px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      transition: color 200ms ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .nav-back:hover { color: var(--text); }

    /* --- LOADING STATE --- */
    #loading {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      letter-spacing: 0.12em;
      color: var(--muted);
      text-transform: uppercase;
    }

    /* --- ERROR STATE --- */
    #error {
      display: none;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 24px;
      text-align: center;
      padding: 48px;
    }

    #error h1 {
      font-size: 48px;
      font-weight: 900;
      text-transform: uppercase;
    }

    /* --- CASE STUDY CONTENT --- */
    #content { display: none; }

    /* --- HERO --- */
    .cs-hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 120px 48px 56px;
      position: relative;
      overflow: hidden;
    }

    .cs-hero-cover {
      position: absolute;
      inset: 0;
      background: #1A1A1A;
      background-size: cover;
      background-position: center;
      z-index: 0;
    }

    .cs-hero-cover::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(10,10,10,1) 0%, rgba(10,10,10,0.4) 60%, rgba(10,10,10,0.1) 100%);
    }

    .cs-hero-content {
      position: relative;
      z-index: 1;
    }

    .cs-meta-row {
      display: flex;
      gap: 48px;
      margin-bottom: 32px;
      flex-wrap: wrap;
    }

    .cs-meta-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .cs-meta-label {
      font-size: 11px;
      letter-spacing: 0.12em;
      color: var(--muted);
      text-transform: uppercase;
    }

    .cs-meta-value {
      font-size: 14px;
      font-weight: 400;
      color: var(--text);
    }

    .cs-title {
      font-size: clamp(48px, 7vw, 110px);
      font-weight: 900;
      line-height: 0.92;
      text-transform: uppercase;
      letter-spacing: -0.02em;
      margin-bottom: 32px;
    }

    .cs-tags {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .cs-tag {
      font-size: 11px;
      letter-spacing: 0.1em;
      color: var(--muted);
    }

    .cs-tag::before { content: "• "; }

    /* --- OVERVIEW --- */
    .cs-overview {
      padding: 80px 48px;
      max-width: 800px;
    }

    .cs-overview-label {
      font-size: 12px;
      letter-spacing: 0.12em;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 24px;
    }

    .cs-overview-label::before { content: "• "; }

    .cs-overview-text {
      font-size: clamp(20px, 2.4vw, 30px);
      font-weight: 400;
      line-height: 1.5;
      color: var(--text);
    }

    /* --- SECTIONS --- */
    .cs-sections {
      padding: 0 48px 80px;
    }

    .cs-section {
      border-top: 1px solid var(--divider);
      padding: 64px 0;
    }

    /* TEXT SECTION */
    .cs-section-text .cs-section-label {
      font-size: 12px;
      letter-spacing: 0.12em;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 24px;
    }

    .cs-section-text .cs-section-label::before { content: "• "; }

    .cs-section-body {
      font-size: 16px;
      line-height: 1.75;
      color: rgba(255,255,255,0.8);
      max-width: 680px;
    }

    /* IMAGE SECTION */
    .cs-section-image img {
      width: 100%;
      height: 560px;
      object-fit: cover;
      background: #1A1A1A;
      display: block;
    }

    .cs-image-placeholder {
      width: 100%;
      height: 560px;
      background: #1A1A1A;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cs-image-placeholder span {
      font-size: 12px;
      letter-spacing: 0.12em;
      color: rgba(255,255,255,0.12);
      text-transform: uppercase;
    }

    .cs-caption {
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 0.06em;
      margin-top: 16px;
    }

    /* METRICS SECTION */
    .cs-metrics {
      display: flex;
      gap: 0;
      border-top: 1px solid var(--divider);
      padding: 64px 0;
    }

    .cs-metric {
      flex: 1;
      padding: 0 48px 0 0;
      border-right: 1px solid var(--divider);
    }

    .cs-metric:last-child {
      border-right: none;
      padding-right: 0;
      padding-left: 48px;
    }

    .cs-metric:not(:first-child):not(:last-child) {
      padding: 0 48px;
    }

    .cs-metric-value {
      font-size: clamp(40px, 5vw, 72px);
      font-weight: 900;
      line-height: 1;
      margin-bottom: 12px;
    }

    .cs-metric-label {
      font-size: 13px;
      color: var(--muted);
      letter-spacing: 0.06em;
    }

    /* --- NEXT PROJECT --- */
    .cs-next {
      border-top: 1px solid var(--divider);
      padding: 64px 48px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .cs-next-label {
      font-size: 12px;
      letter-spacing: 0.12em;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 12px;
    }

    .cs-next-label::before { content: "• "; }

    .cs-next-title {
      font-size: clamp(24px, 3vw, 48px);
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: -0.02em;
    }

    .cs-next-link {
      font-size: 14px;
      letter-spacing: 0.06em;
      color: var(--muted);
      transition: transform 200ms ease, color 200ms ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }

    .cs-next-link:hover {
      transform: translateX(6px);
      color: var(--text);
    }

    /* --- FOOTER --- */
    footer {
      padding: 32px 48px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid var(--divider);
    }

    .footer-copy {
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 0.06em;
    }

    /* --- REVEAL --- */
    .reveal {
      opacity: 0;
      transform: translateY(30px);
      transition: opacity 700ms ease, transform 700ms ease;
    }

    .reveal.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* --- RESPONSIVE: TABLET 768px --- */
    @media (max-width: 768px) {
      nav { padding: 24px 32px; }
      .cs-hero { padding: 100px 32px 48px; }
      .cs-overview { padding: 64px 32px; }
      .cs-sections { padding: 0 32px 64px; }
      .cs-next { padding: 48px 32px; flex-direction: column; align-items: flex-start; gap: 32px; }
      footer { padding: 24px 32px; }
      .cs-metrics { flex-direction: column; gap: 40px; }
      .cs-metric, .cs-metric:last-child, .cs-metric:not(:first-child):not(:last-child) {
        padding: 0;
        border-right: none;
        border-bottom: 1px solid var(--divider);
        padding-bottom: 40px;
      }
      .cs-metric:last-child { border-bottom: none; padding-bottom: 0; }
    }

    /* --- RESPONSIVE: MOBILE 480px --- */
    @media (max-width: 480px) {
      nav { padding: 20px 24px; }
      .cs-hero { padding: 90px 24px 40px; }
      .cs-overview { padding: 56px 24px; }
      .cs-sections { padding: 0 24px 56px; }
      .cs-next { padding: 40px 24px; }
      footer { padding: 24px; flex-direction: column; gap: 8px; text-align: center; }
      .cs-section-image img, .cs-image-placeholder { height: 280px; }
    }
  </style>
</head>

<body>

  <!-- --- NAV --- -->
  <nav>
    <a href="/" class="nav-logo">Raquel Palis</a>
    <a href="/" class="nav-back">← Back to Portfolio</a>
  </nav>

  <!-- --- LOADING --- -->
  <div id="loading">Loading case study…</div>

  <!-- --- ERROR --- -->
  <div id="error">
    <h1>404</h1>
    <p style="color: var(--muted); font-size: 16px;">Case study not found.</p>
    <a href="/" style="font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); border-bottom: 1px solid var(--divider); padding-bottom: 4px;">← Back to Portfolio</a>
  </div>

  <!-- --- CASE STUDY CONTENT (rendered by JS) --- -->
  <div id="content"></div>

  <script>
    /* --- CMS RENDERER --- */

    // Get slug from URL: /case-study/heathrow-rewards
    function getSlug() {
      const parts = window.location.pathname.split('/');
      return parts[parts.length - 1] || new URLSearchParams(window.location.search).get('slug');
    }

    // Render a section based on its type
    function renderSection(section) {
      if (section.type === 'text') {
        return `
          <div class="cs-section cs-section-text reveal">
            ${section.label ? `<p class="cs-section-label">${section.label}</p>` : ''}
            <p class="cs-section-body">${section.content}</p>
          </div>`;
      }

      if (section.type === 'image') {
        return `
          <div class="cs-section cs-section-image reveal">
            <div class="cs-image-placeholder">
              <span>Image placeholder</span>
            </div>
            ${section.caption ? `<p class="cs-caption">${section.caption}</p>` : ''}
          </div>`;
      }

      if (section.type === 'metrics') {
        const items = section.items.map((item, i) => `
          <div class="cs-metric">
            <p class="cs-metric-value">${item.value}</p>
            <p class="cs-metric-label">${item.label}</p>
          </div>`).join('');
        return `<div class="cs-metrics reveal">${items}</div>`;
      }

      return '';
    }

    // Render next project link
    function renderNext(slug, title) {
      if (!slug) return '';
      return `
        <div class="cs-next reveal">
          <div>
            <p class="cs-next-label">Next Project</p>
            <p class="cs-next-title">${title || slug}</p>
          </div>
          <a href="/case-study/${slug}" class="cs-next-link">View Project →</a>
        </div>`;
    }

    // Build full page from CMS data
    function renderPage(data) {
      document.title = `${data.title} — Raquel Palis`;

      const coverStyle = data.cover
        ? `background-image: url('${data.cover}');`
        : '';

      const tags = (data.tags || []).map(t => `<span class="cs-tag">${t}</span>`).join('');
      const sections = (data.sections || []).map(renderSection).join('');

      return `
        <!-- --- HERO --- -->
        <section class="cs-hero">
          <div class="cs-hero-cover" style="${coverStyle}"></div>
          <div class="cs-hero-content">
            <div class="cs-meta-row">
              ${data.year ? `<div class="cs-meta-item"><span class="cs-meta-label">Year</span><span class="cs-meta-value">${data.year}</span></div>` : ''}
              ${data.role ? `<div class="cs-meta-item"><span class="cs-meta-label">Role</span><span class="cs-meta-value">${data.role}</span></div>` : ''}
              ${data.client ? `<div class="cs-meta-item"><span class="cs-meta-label">Client</span><span class="cs-meta-value">${data.client}</span></div>` : ''}
            </div>
            <h1 class="cs-title">${data.title}</h1>
            <div class="cs-tags">${tags}</div>
          </div>
        </section>

        <!-- --- OVERVIEW --- -->
        ${data.overview ? `
        <div style="border-top: 1px solid var(--divider);"></div>
        <div class="cs-overview reveal">
          <p class="cs-overview-label">Overview</p>
          <p class="cs-overview-text">${data.overview}</p>
        </div>` : ''}

        <!-- --- SECTIONS --- -->
        <div class="cs-sections">${sections}</div>

        <!-- --- NEXT PROJECT --- -->
        <div style="border-top: 1px solid var(--divider);"></div>
        ${renderNext(data.next, data.nextTitle)}

        <!-- --- FOOTER --- -->
        <footer>
          <p class="footer-copy">© 2026 Raquel Palis. All rights reserved.</p>
          <p class="footer-copy">Barcelona / Worldwide</p>
        </footer>
      `;
    }

    // Scroll reveal
    function initReveal() {
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add('visible');
            observer.unobserve(entry.target);
          }
        });
      }, { threshold: 0.1 });

      document.querySelectorAll('.reveal').forEach(el => {
        const rect = el.getBoundingClientRect();
        if (rect.top < window.innerHeight) {
          el.classList.add('visible');
        } else {
          observer.observe(el);
        }
      });
    }

    // Fetch and render
    async function init() {
      const slug = getSlug();

      if (!slug) {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('error').style.display = 'flex';
        return;
      }

      try {
        const res = await fetch(`/content/case-studies/${slug}.json`);
        if (!res.ok) throw new Error('Not found');
        const data = await res.json();

        const content = document.getElementById('content');
        content.innerHTML = renderPage(data);
        content.style.display = 'block';
        document.getElementById('loading').style.display = 'none';

        initReveal();
      } catch (e) {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('error').style.display = 'flex';
      }
    }

    init();
  </script>

</body>
</html>
