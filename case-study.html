<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Case Study — Raquel Palis</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet" />

  <style>
    /* --- RESET & BASE --- */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0A0A0A;
      --bg-hero:  #12121a;
      --text:     #FFFFFF;
      --muted:    rgba(255,255,255,0.45);
      --disabled: rgba(255,255,255,0.15);
      --divider:  rgba(255,255,255,0.08);
      --surface:  rgba(255,255,255,0.08);
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-weight: 400;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; text-decoration: none; }

    /* --- NAV --- */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      height: 70px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 48px;
      background: rgba(10,10,10,0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .nav-logo {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .nav-back {
      font-size: 12px;
      font-weight: 400;
      letter-spacing: 0.08em;
      color: var(--muted);
      transition: color 200ms ease;
    }

    .nav-back:hover { color: var(--text); }

    /* --- STATES --- */
    #loading {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      letter-spacing: 0.12em;
      color: var(--muted);
      text-transform: uppercase;
    }

    #error {
      display: none;
      min-height: 100vh;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 24px;
      text-align: center;
      padding: 48px;
    }

    #error h1 { font-size: 48px; font-weight: 900; text-transform: uppercase; }

    #content { display: none; }

    /* --- HERO --- */
    .cs-hero {
      position: relative;
      height: 760px;
      background: var(--bg-hero);
      overflow: hidden;
    }

    .cs-hero-img {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      opacity: 0.35;
    }

    .cs-hero-gradient {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(10,10,10,0.85) 0%, rgba(10,10,10,0.2) 60%, rgba(10,10,10,0) 100%);
    }

    .cs-hero-title {
      position: absolute;
      left: 48px;
      top: 330px;
      font-size: 88px;
      font-weight: 900;
      line-height: 0.9;
      letter-spacing: -0.02em;
      text-transform: uppercase;
      color: var(--text);
      max-width: 900px;
    }

    .cs-hero-meta {
      position: absolute;
      bottom: 64px;
      left: 48px;
      display: flex;
      gap: 48px;
    }

    .cs-hero-meta-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .cs-meta-cap {
      font-size: 10px;
      font-weight: 400;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
      line-height: 1.5;
    }

    .cs-meta-val {
      font-size: 13px;
      font-weight: 400;
      letter-spacing: 0.04em;
      color: var(--text);
      line-height: 1.5;
    }

    /* --- INFO BAR --- */
    .cs-info-bar {
      display: flex;
      height: 80px;
      border-top: 1px solid var(--disabled);
      border-bottom: 1px solid var(--disabled);
    }

    .cs-info-cell {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 22px 32px;
      border-right: 1px solid var(--disabled);
    }

    .cs-info-cell:last-child { border-right: none; }

    /* --- FULL WIDTH IMAGE --- */
    .cs-img-full-wrap {
      padding: 47px;
    }

    .cs-img-full {
      width: 100%;
      height: 640px;
      border-radius: 24px;
      border: 1px solid var(--surface);
      overflow: hidden;
      background: #1a1a28;
    }

    .cs-img-full img, .cs-img-full .cs-bg-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      background-size: cover;
      background-position: center;
    }

    /* --- OVERVIEW --- */
    .cs-overview {
      padding: 80px 48px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .cs-overview-cap {
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.14em;
      color: var(--muted);
    }

    .cs-overview-cap::before { content: "• "; }

    .cs-overview-heading {
      font-size: 32px;
      font-weight: 900;
      line-height: 1.1;
      letter-spacing: -0.02em;
      text-transform: uppercase;
      max-width: 900px;
    }

    /* --- DIVIDER --- */
    .cs-divider { height: 1px; background: var(--disabled); }

    /* --- GENERIC SECTION --- */
    .cs-section {
      padding: 64px 48px;
      display: flex;
      flex-direction: column;
      gap: 64px;
    }

    .cs-section-label {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.19em;
      text-transform: uppercase;
      color: var(--text);
      line-height: 1.5;
    }

    /* --- TWO-COL TEXT + IMAGE --- */
    .cs-two-col {
      display: flex;
      gap: 43px;
      align-items: flex-start;
    }

    .cs-two-col-text {
      flex: 0 0 550px;
      font-size: 16px;
      font-weight: 400;
      line-height: 1.625;
      color: var(--text);
      white-space: pre-line;
    }

    .cs-two-col-image {
      flex: 1;
      border: 1px solid var(--surface);
      border-radius: 16px;
      overflow: hidden;
      min-height: 360px;
    }

    .cs-two-col-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* --- WIDE TEXT --- */
    .cs-text-wide {
      font-size: 16px;
      font-weight: 400;
      line-height: 1.625;
      color: var(--text);
      white-space: pre-line;
      max-width: 840px;
    }

    /* --- TWO-COL LABEL + TEXT --- */
    .cs-label-row {
      display: flex;
      gap: 64px;
      align-items: flex-start;
    }

    .cs-label-col {
      flex: 0 0 180px;
    }

    .cs-label-body {
      flex: 1;
      font-size: 16px;
      font-weight: 400;
      line-height: 1.625;
      color: var(--text);
      white-space: pre-line;
    }

    /* --- METHODOLOGY STATS --- */
    .cs-method-stats {
      display: flex;
      gap: 0;
      border: 1px solid var(--surface);
      border-radius: 16px;
      overflow: hidden;
    }

    .cs-method-stat {
      flex: 1;
      padding: 28px 32px;
      border-right: 1px solid var(--surface);
    }

    .cs-method-stat:last-child { border-right: none; }

    .cs-method-stat-val {
      font-size: 40px;
      font-weight: 900;
      line-height: 1;
      margin-bottom: 8px;
      letter-spacing: -0.02em;
    }

    .cs-method-stat-label {
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 0.06em;
    }

    /* --- FINDINGS --- */
    .cs-sus-row {
      display: flex;
      align-items: baseline;
      gap: 16px;
      margin-bottom: 48px;
    }

    .cs-sus-score {
      font-size: 72px;
      font-weight: 900;
      letter-spacing: -0.03em;
      line-height: 1;
    }

    .cs-sus-label {
      font-size: 13px;
      color: var(--muted);
      letter-spacing: 0.08em;
    }

    .cs-findings-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 16px;
    }

    .cs-finding {
      border: 1px solid var(--surface);
      border-radius: 16px;
      padding: 28px 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .cs-finding-id {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .cs-finding-stat {
      font-size: 48px;
      font-weight: 900;
      line-height: 1;
      letter-spacing: -0.03em;
    }

    .cs-finding-title {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      line-height: 1.4;
    }

    .cs-finding-body {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.6;
    }

    /* --- SECTION IMAGE --- */
    .cs-section-image-wrap {
      border: 1px solid var(--surface);
      border-radius: 16px;
      overflow: hidden;
    }

    .cs-section-image-wrap img {
      width: 100%;
      display: block;
      object-fit: cover;
    }

    .cs-caption {
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 0.06em;
      margin-top: 16px;
      padding: 0 4px;
    }

    /* --- METRICS (OUTCOME) --- */
    .cs-outcome-list {
      display: flex;
      flex-direction: column;
      gap: 0;
      border: 1px solid var(--surface);
      border-radius: 16px;
      overflow: hidden;
    }

    .cs-outcome-item {
      display: flex;
      align-items: center;
      gap: 32px;
      padding: 28px 32px;
      border-bottom: 1px solid var(--surface);
    }

    .cs-outcome-item:last-child { border-bottom: none; }

    .cs-outcome-value {
      font-size: 48px;
      font-weight: 900;
      line-height: 1;
      letter-spacing: -0.03em;
      min-width: 140px;
    }

    .cs-outcome-label {
      font-size: 16px;
      color: var(--muted);
      line-height: 1.5;
    }

    /* --- NEXT PROJECT --- */
    .cs-next {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 64px 48px;
    }

    .cs-next-cap {
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.14em;
      color: var(--muted);
      margin-bottom: 12px;
    }

    .cs-next-cap::before { content: "• "; }

    .cs-next-title {
      font-size: 56px;
      font-weight: 900;
      line-height: 1;
      letter-spacing: -0.02em;
      text-transform: uppercase;
    }

    .cs-next-link {
      font-size: 13px;
      letter-spacing: 0.04em;
      color: var(--muted);
      white-space: nowrap;
      transition: color 200ms ease, transform 200ms ease;
      display: inline-block;
    }

    .cs-next-link:hover { color: var(--text); transform: translateX(6px); }

    /* --- FOOTER --- */
    footer {
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 48px;
      border-top: 1px solid var(--disabled);
    }

    .footer-copy {
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 0.08em;
    }

    /* --- REVEAL --- */
    .reveal {
      opacity: 0;
      transform: translateY(24px);
      transition: opacity 700ms ease, transform 700ms ease;
    }

    .reveal.visible { opacity: 1; transform: none; }

    /* --- RESPONSIVE: TABLET 768px --- */
    @media (max-width: 768px) {
      nav { padding: 20px 32px; }
      .cs-hero { height: 600px; }
      .cs-hero-title { font-size: clamp(48px, 8vw, 72px); left: 32px; top: 260px; }
      .cs-hero-meta { left: 32px; gap: 32px; }
      .cs-img-full-wrap { padding: 24px; }
      .cs-img-full { height: 400px; }
      .cs-overview { padding: 64px 32px; }
      .cs-section { padding: 48px 32px; gap: 40px; }
      .cs-two-col { flex-direction: column; }
      .cs-two-col-text { flex: none; }
      .cs-label-row { flex-direction: column; gap: 24px; }
      .cs-label-col { flex: none; }
      .cs-findings-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
      .cs-next { padding: 48px 32px; flex-direction: column; align-items: flex-start; gap: 32px; }
      .cs-next-title { font-size: clamp(32px, 6vw, 48px); }
      footer { padding: 20px 32px; }
      .cs-info-bar { flex-wrap: wrap; height: auto; }
      .cs-info-cell { min-width: 50%; }
      .cs-method-stats { flex-direction: column; }
      .cs-outcome-value { font-size: 36px; min-width: 110px; }
    }

    /* --- RESPONSIVE: MOBILE 480px --- */
    @media (max-width: 480px) {
      nav { padding: 20px 24px; }
      .cs-hero { height: 480px; }
      .cs-hero-title { font-size: clamp(36px, 10vw, 56px); left: 24px; top: 200px; }
      .cs-hero-meta { left: 24px; bottom: 40px; gap: 24px; flex-wrap: wrap; }
      .cs-img-full-wrap { padding: 16px; }
      .cs-img-full { height: 260px; }
      .cs-overview { padding: 48px 24px; }
      .cs-overview-heading { font-size: 24px; }
      .cs-section { padding: 40px 24px; gap: 32px; }
      .cs-findings-grid { grid-template-columns: 1fr; }
      .cs-finding-stat { font-size: 36px; }
      .cs-sus-score { font-size: 56px; }
      .cs-outcome-value { font-size: 32px; }
      .cs-next { padding: 40px 24px; }
      footer { padding: 20px 24px; flex-direction: column; gap: 8px; text-align: center; }
    }
  </style>
</head>
<body>

  <!-- --- NAV --- -->
  <nav>
    <a href="/" class="nav-logo">Raquel Palis</a>
    <a href="/" class="nav-back">← Portfolio</a>
  </nav>

  <div id="loading">Loading…</div>

  <div id="error">
    <h1>404</h1>
    <p style="color:var(--muted);font-size:16px;">Case study not found.</p>
    <a href="/" style="font-size:13px;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--divider);padding-bottom:4px;">← Back to Portfolio</a>
  </div>

  <div id="content"></div>

  <script>
    /* --- SLUG --- */
    function getSlug() {
      const parts = window.location.pathname.split('/');
      return parts[parts.length - 1] || new URLSearchParams(window.location.search).get('slug');
    }

    /* --- RENDER SECTIONS --- */
    function renderSection(s) {

      /* FULL-WIDTH IMAGE */
      if (s.type === 'image') {
        const label = s.label ? `<p class="cs-section-label">${s.label}</p>` : '';
        const cap   = s.caption ? `<p class="cs-caption">${s.caption}</p>` : '';
        return `
          <div class="cs-section reveal">
            ${label}
            <div class="cs-section-image-wrap">
              <img src="${s.src}" alt="${s.alt || ''}" loading="lazy" />
            </div>
            ${cap}
          </div>`;
      }

      /* TEXT — two-column label + body */
      if (s.type === 'text') {
        return `
          <div class="cs-section cs-divider-top reveal">
            <div class="cs-label-row">
              <div class="cs-label-col">
                <p class="cs-section-label">${s.label || ''}</p>
              </div>
              <div class="cs-label-body">${s.content.replace(/\n/g, '<br>')}</div>
            </div>
          </div>`;
      }

      /* METHODOLOGY */
      if (s.type === 'methodology') {
        const stats = (s.stats || []).map(st => `
          <div class="cs-method-stat">
            <p class="cs-method-stat-val">${st.value}</p>
            <p class="cs-method-stat-label">${st.label}</p>
          </div>`).join('');
        return `
          <div class="cs-section reveal">
            <p class="cs-section-label">${s.label || 'METHODOLOGY'}</p>
            <div class="cs-method-stats">${stats}</div>
            <div class="cs-label-body">${s.body.replace(/\n/g, '<br>')}</div>
          </div>`;
      }

      /* FINDINGS */
      if (s.type === 'findings') {
        const cards = (s.items || []).map(f => `
          <div class="cs-finding">
            <p class="cs-finding-id">${f.id}</p>
            <p class="cs-finding-stat">${f.stat}</p>
            <p class="cs-finding-title">${f.title}</p>
            <p class="cs-finding-body">${f.body}</p>
          </div>`).join('');
        return `
          <div class="cs-section reveal">
            <div style="display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:16px;">
              <p class="cs-section-label">${s.label || 'FINDINGS'}</p>
              ${s.sus ? `<div class="cs-sus-row"><span class="cs-sus-score">${s.sus}</span><span class="cs-sus-label">SUS Score — Marginal (threshold 68+)</span></div>` : ''}
            </div>
            <div class="cs-findings-grid">${cards}</div>
          </div>`;
      }

      /* METRICS / OUTCOME */
      if (s.type === 'metrics') {
        const items = (s.items || []).map(m => `
          <div class="cs-outcome-item">
            <p class="cs-outcome-value">${m.value}</p>
            <p class="cs-outcome-label">${m.label}</p>
          </div>`).join('');
        return `
          <div class="cs-section reveal">
            <p class="cs-section-label">${s.label || 'OUTCOME'}</p>
            <div class="cs-outcome-list">${items}</div>
          </div>`;
      }

      return '';
    }

    /* --- BUILD PAGE --- */
    function renderPage(d) {
      document.title = `${d.title} — Raquel Palis`;

      const heroStyle = d.cover ? `background-image:url('${d.cover}')` : '';

      const sections = (d.sections || []).map(renderSection).join('');

      const next = d.next ? `
        <div class="cs-divider"></div>
        <div class="cs-next reveal">
          <div>
            <p class="cs-next-cap">Next Project</p>
            <p class="cs-next-title">${d.nextTitle || d.next}</p>
          </div>
          <a href="/case-study/${d.next}" class="cs-next-link">View Project →</a>
        </div>` : '';

      return `
        <!-- HERO -->
        <section class="cs-hero">
          <div class="cs-hero-img" style="${heroStyle}"></div>
          <div class="cs-hero-gradient"></div>
          <h1 class="cs-hero-title">${d.title}</h1>
          <div class="cs-hero-meta">
            ${d.year     ? `<div class="cs-hero-meta-item"><span class="cs-meta-cap">Year</span><span class="cs-meta-val">${d.year}</span></div>` : ''}
            ${d.client   ? `<div class="cs-hero-meta-item"><span class="cs-meta-cap">Client</span><span class="cs-meta-val">${d.client}</span></div>` : ''}
            ${d.role     ? `<div class="cs-hero-meta-item"><span class="cs-meta-cap">Role</span><span class="cs-meta-val">${d.role}</span></div>` : ''}
          </div>
        </section>

        <!-- INFO BAR -->
        <div class="cs-info-bar">
          ${d.year      ? `<div class="cs-info-cell"><span class="cs-meta-cap">Year</span><span class="cs-meta-val">${d.year}</span></div>` : ''}
          ${d.client    ? `<div class="cs-info-cell"><span class="cs-meta-cap">Client</span><span class="cs-meta-val">${d.client}</span></div>` : ''}
          ${d.industry  ? `<div class="cs-info-cell"><span class="cs-meta-cap">Industry</span><span class="cs-meta-val">${d.industry}</span></div>` : ''}
          ${d.duration  ? `<div class="cs-info-cell"><span class="cs-meta-cap">Duration</span><span class="cs-meta-val">${d.duration}</span></div>` : ''}
          ${d.role && !d.duration ? `<div class="cs-info-cell"><span class="cs-meta-cap">Role</span><span class="cs-meta-val">${d.role}</span></div>` : ''}
        </div>

        <!-- OVERVIEW -->
        ${d.overview ? `
        <div class="cs-overview reveal">
          <p class="cs-overview-cap">Overview</p>
          <h2 class="cs-overview-heading">${d.overview}</h2>
          ${d.overviewText ? `<p style="font-size:16px;line-height:1.625;color:var(--muted);max-width:760px;">${d.overviewText}</p>` : ''}
        </div>
        <div class="cs-divider"></div>` : ''}

        <!-- SECTIONS -->
        ${sections}

        <!-- NEXT -->
        ${next}

        <!-- FOOTER -->
        <footer>
          <p class="footer-copy">© 2026 Raquel Palis. All rights reserved.</p>
          <p class="footer-copy">Barcelona / Worldwide</p>
        </footer>`;
    }

    /* --- REVEAL --- */
    function initReveal() {
      const obs = new IntersectionObserver(entries => {
        entries.forEach(e => {
          if (e.isIntersecting) { e.target.classList.add('visible'); obs.unobserve(e.target); }
        });
      }, { threshold: 0.08 });

      document.querySelectorAll('.reveal').forEach(el => {
        const r = el.getBoundingClientRect();
        if (r.top < window.innerHeight) el.classList.add('visible');
        else obs.observe(el);
      });
    }

    /* --- INIT --- */
    async function init() {
      const slug = getSlug();
      if (!slug) { document.getElementById('loading').style.display = 'none'; document.getElementById('error').style.display = 'flex'; return; }
      try {
        const res = await fetch(`/content/case-studies/${slug}.json`);
        if (!res.ok) throw new Error();
        const data = await res.json();
        const content = document.getElementById('content');
        content.innerHTML = renderPage(data);
        content.style.display = 'block';
        document.getElementById('loading').style.display = 'none';
        initReveal();
      } catch {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('error').style.display = 'flex';
      }
    }

    init();
  </script>

</body>
</html>
